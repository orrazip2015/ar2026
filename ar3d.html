<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR 3D Geolocalizado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ar3d.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <div class="container-fluid overlay-wrap d-flex align-items-end p-2 p-sm-3" id="overlay">
      <section id="hudPanel" class="overlay card w-100 mx-auto shadow">
        <div class="card-body p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h1 class="h6 mb-0">AR 3D Geolocalizado</h1>
            <button id="menuCollapseBtn" class="btn btn-sm btn-outline-secondary" type="button">Bajar menu</button>
          </div>
          <p id="arStatus" class="small mb-2">Presiona el boton para activar camara, ubicacion y brujula.</p>

          <div class="target-config rounded-3 p-2 mb-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <p class="target-title mb-0">Coordenadas del objetivo</p>
              <small id="targetInfo" class="target-info">Sin objetivo guardado</small>
            </div>

            <div class="row g-2">
              <div class="col-6">
                <label class="form-label form-label-sm mb-1" for="latInput">Latitud</label>
                <input
                  id="latInput"
                  class="form-control form-control-sm"
                  type="number"
                  step="any"
                  inputmode="decimal"
                  placeholder="Ej: -29.9127825"
                />
              </div>
              <div class="col-6">
                <label class="form-label form-label-sm mb-1" for="lonInput">Longitud</label>
                <input
                  id="lonInput"
                  class="form-control form-control-sm"
                  type="number"
                  step="any"
                  inputmode="decimal"
                  placeholder="Ej: -71.2582358"
                />
              </div>
              <div class="col-12">
                <label class="form-label form-label-sm mb-1" for="messageInput">Mensaje en el punto</label>
                <input
                  id="messageInput"
                  class="form-control form-control-sm"
                  type="text"
                  maxlength="80"
                  placeholder="Ej: Aqui esta el punto"
                />
              </div>
              <div class="col-12 d-grid d-sm-flex gap-2">
                <button id="saveCoordsBtn" class="btn btn-sm btn-primary flex-fill" type="button">
                  Guardar objetivo
                </button>
                <button id="resetCoordsBtn" class="btn btn-sm btn-outline-secondary flex-fill" type="button">
                  Limpiar objetivo
                </button>
              </div>
            </div>
          </div>

          <button id="activateAr" class="btn btn-primary w-100" type="button">Iniciar AR 3D</button>
          <p class="tip small mt-2 mb-0">Apunta hacia el objetivo para ver el rotulo en camara.</p>
          <a class="small" href="index.html">Volver a version clasica</a>
        </div>
      </section>

      <button id="menuOpenBtn" class="btn btn-primary btn-sm menu-fab hidden" type="button">Subir menu</button>
    </div>

    <a-scene
      id="arScene"
      class="hidden"
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; alpha: true"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    >
      <a-camera gps-camera rotation-reader></a-camera>

      <a-entity
        id="targetLabel"
        gps-entity-place="latitude: 0; longitude: 0"
        visible="false"
        position="0 0 0"
      >
        <!-- Pokéball superior rojo -->
        <a-sphere
          id="pokeball-top"
          radius="1"
          color="#E41E3D"
          material="side: double"
        ></a-sphere>

        <!-- Banda blanca del medio -->
        <a-box
          position="0 0 1.01"
          width="2.1"
          height="0.35"
          depth="0.1"
          color="white"
          material="side: double"
        ></a-box>

        <!-- Pokéball inferior blanca -->
        <a-sphere
          id="pokeball-bottom"
          position="0 -1.15 0"
          radius="0.85"
          color="white"
          material="side: double"
        ></a-sphere>

        <!-- Círculo central (botón) -->
        <a-sphere
          id="pokeball-center"
          position="0 0 1.02"
          radius="0.35"
          color="#333333"
          material="side: double"
        ></a-sphere>

        <!-- Texto debajo -->
        <a-text
          position="0 -3 0"
          value="¡Objetivo encontrado!"
          align="center"
          width="8"
          color="white"
          font="dejavu"
          anchor="center"
        ></a-text>
      </a-entity>
    </a-scene>

    <script src="ar3d.js"></script>
  </body>
</html>
