<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR 3D Geolocalizado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ar3d.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <div class="container-fluid overlay-wrap d-flex align-items-end p-2 p-sm-3" id="overlay">
      <section class="overlay card w-100 mx-auto text-light border-light-subtle shadow-lg">
        <div class="card-body p-3">
          <h1 class="h6 mb-2">AR 3D Geolocalizado</h1>
          <p id="arStatus" class="small mb-2">Presiona el boton para activar camara, ubicacion y brujula.</p>

          <div class="target-config rounded-3 p-2 mb-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <p class="target-title mb-0">Coordenadas del objetivo</p>
              <small id="targetInfo" class="target-info">Sin objetivo guardado</small>
            </div>

            <div class="row g-2">
              <div class="col-6">
                <label class="form-label form-label-sm mb-1" for="latInput">Latitud</label>
                <input
                  id="latInput"
                  class="form-control form-control-sm"
                  type="number"
                  step="any"
                  inputmode="decimal"
                  placeholder="Ej: -29.9127825"
                />
              </div>
              <div class="col-6">
                <label class="form-label form-label-sm mb-1" for="lonInput">Longitud</label>
                <input
                  id="lonInput"
                  class="form-control form-control-sm"
                  type="number"
                  step="any"
                  inputmode="decimal"
                  placeholder="Ej: -71.2582358"
                />
              </div>
              <div class="col-12">
                <label class="form-label form-label-sm mb-1" for="messageInput">Mensaje en el punto</label>
                <input
                  id="messageInput"
                  class="form-control form-control-sm"
                  type="text"
                  maxlength="80"
                  placeholder="Ej: Aqui esta el punto"
                />
              </div>
              <div class="col-12 d-grid d-sm-flex gap-2">
                <button id="saveCoordsBtn" class="btn btn-sm btn-outline-light flex-fill" type="button">
                  Guardar objetivo
                </button>
                <button id="resetCoordsBtn" class="btn btn-sm btn-outline-warning flex-fill" type="button">
                  Limpiar objetivo
                </button>
              </div>
            </div>
          </div>

          <button id="activateAr" class="btn btn-success w-100" type="button">Iniciar AR 3D</button>
          <p class="tip small mt-2 mb-0">Apunta hacia el objetivo para ver el rotulo en camara.</p>
          <a class="link-light small" href="index.html">Volver a version clasica</a>
        </div>
      </section>
    </div>

    <a-scene
      id="arScene"
      class="hidden"
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; alpha: true"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    >
      <a-camera gps-camera rotation-reader></a-camera>

      <a-entity
        id="targetLabel"
        gps-entity-place="latitude: 0; longitude: 0"
        geometry="primitive: plane; width: 6; height: 2"
        material="color: #f4ff75; opacity: 0.92; side: double"
        text="value: aqui esta el punto; align: center; color: #003828; width: 10"
        visible="false"
        scale="6 6 6"
      ></a-entity>
    </a-scene>

    <script src="ar3d.js"></script>
  </body>
</html>
