<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR Geolocalizado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <video id="camera" autoplay playsinline muted></video>

      <div class="container-fluid d-flex align-items-end h-100 p-2 p-sm-3">
        <section class="hud card w-100 mx-auto text-light border-light-subtle shadow-lg">
          <div class="card-body p-3">
            <h1 class="h6 mb-2">AR Geolocalizado</h1>
            <p id="status" class="small mb-2">Iniciando camara, ubicacion y brujula...</p>
            <p class="hint small mb-2">Apunta el celular hacia el objetivo para ver el mensaje.</p>

            <div class="target-config rounded-3 p-2 mb-2">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <p class="target-title mb-0">Coordenadas del objetivo</p>
                <small id="targetInfo" class="target-info">Sin objetivo guardado</small>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label form-label-sm mb-1" for="latInput">Latitud</label>
                  <input
                    id="latInput"
                    class="form-control form-control-sm"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Ej: -29.9127825"
                  />
                </div>
                <div class="col-6">
                  <label class="form-label form-label-sm mb-1" for="lonInput">Longitud</label>
                  <input
                    id="lonInput"
                    class="form-control form-control-sm"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Ej: -71.2582358"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label form-label-sm mb-1" for="messageInput">Mensaje en el punto</label>
                  <input
                    id="messageInput"
                    class="form-control form-control-sm"
                    type="text"
                    maxlength="80"
                    placeholder="Ej: Aqui esta el punto"
                  />
                </div>
                <div class="col-12 d-grid d-sm-flex gap-2">
                  <button id="saveCoordsBtn" class="btn btn-sm btn-outline-light flex-fill" type="button">
                    Guardar objetivo
                  </button>
                  <button id="resetCoordsBtn" class="btn btn-sm btn-outline-warning flex-fill" type="button">
                    Limpiar objetivo
                  </button>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between small mb-1">
              <span>Rumbo al objetivo:</span>
              <strong id="angle">--</strong>
            </div>

            <div class="d-flex justify-content-between small mb-2">
              <span>Distancia estimada:</span>
              <strong id="distance">--</strong>
            </div>

            <button id="startBtn" class="start-btn btn btn-success w-100" type="button">Activar sensores</button>
            <p class="hint small mt-2 mb-0">
              <a class="link-light" href="ar3d.html">Probar version AR 3D con A-Frame + AR.js</a>
            </p>
          </div>
        </section>
      </div>

      <div id="targetMessage" class="target-message hidden">aqui esta el punto</div>
      <div id="reticle" class="reticle hidden"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
